name: Build KOH

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            architecture: x64
          - os: windows-2022
            platform: windows
            architecture: x64
          - os: macos-15-intel
            platform: macos
            architecture: x64
          - os: macos-15
            platform: macos
            architecture: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.architecture }}
          cache: pip

      - name: Resolve version and validate tag and target
        id: metadata
        shell: bash
        run: >-
          python scripts/build.py --metadata
          --github-output "$GITHUB_OUTPUT"
          --expected-platform "${{ matrix.platform }}"
          --expected-architecture "${{ matrix.architecture }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify ONNX models
        shell: bash
        run: |
          test -f models/face_detection_yunet_2023mar.onnx
          test -f models/modnet/modnet_photographic.onnx

      - name: Build, verify version, and package application
        run: python scripts/build.py --package

      - name: Verify Windows version properties
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          KOH_ARTIFACT: ${{ steps.metadata.outputs.artifact }}
          KOH_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $info = (Get-Item "dist/$env:KOH_ARTIFACT.exe").VersionInfo
          if ($info.ProductName -ne "KOH" -or
              $info.FileVersion -ne $env:KOH_VERSION -or
              $info.ProductVersion -ne $env:KOH_VERSION) {
            throw "Executable version properties do not match the application version"
          }

      - name: Upload versioned artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact }}
          path: ${{ steps.metadata.outputs.archive }}
          if-no-files-found: error
